<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>บัญชีรายรับรายจ่าย</title>
<meta name="theme-color" content="#2d4a8a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="รายรับรายจ่าย">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="css">
/* layout: แอปคอลัมน์เดียวบนมือถือ สรุปยอดเดือนด้านบน ปุ่มเพิ่มใหญ่ รายการแยกตามวัน แผ่นกรอกเลื่อนขึ้นจากล่าง */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18212b; --muted:#66727f; --line:#dbe1e7;
  --accent:#2d4a8a; --in:#1d7f4e; --out:#c0392b; --in-soft:#e3f3ea; --out-soft:#fbe7e4;
  --font:"IBM Plex Sans Thai",system-ui,-apple-system,"Noto Sans Thai",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --surface:#19212a; --ink:#e7ecf1; --muted:#93a0ad; --line:#2a3541;
    --accent:#8fb0f0; --in:#5fcf95; --out:#f0806f; --in-soft:#173326; --out-soft:#3a1d19;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#19212a; --ink:#e7ecf1; --muted:#93a0ad; --line:#2a3541;
  --accent:#8fb0f0; --in:#5fcf95; --out:#f0806f; --in-soft:#173326; --out-soft:#3a1d19;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
#root{max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:18px;margin:0;font-weight:600}
.status{font-size:13px;color:var(--muted)}
.status.bad{color:var(--out)}
.month{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.month b{font-weight:600}
.iconbtn{border:0;background:transparent;width:44px;height:44px;border-radius:10px;font-size:22px;line-height:1}
.iconbtn:active{background:var(--line)}
.summary{background:var(--accent);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
:root[data-theme="dark"] .summary{color:#0f1720}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .summary{color:#0f1720}}
.summary .lbl{font-size:14px;opacity:.85}
.summary .bal{font-size:34px;font-weight:700;letter-spacing:-.5px}
.summary .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.summary .row div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.summary .row span{display:block;font-size:13px;opacity:.85}
.summary .row strong{font-size:18px;font-weight:600}
.quick{display:flex;gap:8px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:16px}
.mic{flex:none;width:52px;border:0;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center}
:root[data-theme="dark"] .mic{color:#0f1720}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mic{color:#0f1720}}
.mic.on{background:var(--out);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){.mic.on{animation:none}}
.hint.center{text-align:center}
.heard{font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;line-height:1.5}
.add{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.add button{border:0;border-radius:14px;padding:16px 10px;font-size:17px;font-weight:600}
.add .o{background:var(--out-soft);color:var(--out)}
.add .i{background:var(--in-soft);color:var(--in)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:15px;margin:0 0 10px;font-weight:600;color:var(--muted)}
.src{font-style:normal;font-size:11px;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:0 6px;margin-left:4px;vertical-align:middle}
.insight{margin:0 0 12px;font-size:15px;line-height:1.6}
.up{color:var(--out)} .down{color:var(--in)}
.bar small{font-size:12px;margin-left:4px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:456px;margin:0 auto;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 10px 10px 14px;display:none;align-items:center;gap:8px;z-index:9;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.on{display:flex}
.toast span{flex:1;min-width:0}
.toast button{border:0;background:transparent;color:var(--accent);font-weight:600;padding:8px 6px;filter:brightness(1.6)}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--out);border-radius:4px}
.day{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:4px 2px 6px}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:11px 2px}
.day .item:first-of-type{border-top:0}
.tag{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:13px;font-weight:600}
.tag.out{background:var(--out-soft);color:var(--out)}
.tag.in{background:var(--in-soft);color:var(--in)}
.item .mid{flex:1;min-width:0}
.item .mid b{display:block;font-weight:500}
.item .mid small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.amt{font-weight:600;white-space:nowrap}
.amt.out{color:var(--out)} .amt.in{color:var(--in)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;line-height:1.6}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:8px}
.hint{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
label.ghost,a.ghost{cursor:pointer;text-decoration:none}
.ghost.strong{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .ghost.strong{color:#0f1720}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ghost.strong{color:#0f1720}}
.hint.bad{color:var(--out)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:var(--in);vertical-align:middle}
.dot.sending{background:var(--accent)} .dot.offline{background:#d39b2a} .dot.error{background:var(--out)}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--muted)}
.banner{background:var(--out-soft);color:var(--out);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.5}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;z-index:10}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:480px;background:var(--surface);border-radius:20px 20px 0 0;padding:16px 16px 22px;z-index:11;display:none;flex-direction:column;gap:14px;max-height:92%;overflow-y:auto}
.sheet.on{display:flex}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px;font-weight:600;color:var(--muted)}
.seg button.on.out{background:var(--surface);color:var(--out)}
.seg button.on.in{background:var(--surface);color:var(--in)}
.amtbox{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding:4px 2px}
.amtbox span{font-size:26px;color:var(--muted)}
.amtbox input{border:0;background:transparent;font-size:38px;font-weight:700;width:100%;outline:none;font-variant-numeric:tabular-nums}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:15px}
.chip.add{border-style:dashed;color:var(--muted)}
.chip.own{border-color:var(--out);color:var(--out)}
.newcat{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.newcat .save{padding:10px 18px;font-size:16px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.txt{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save{border:0;border-radius:14px;padding:16px;font-size:17px;font-weight:600;background:var(--accent);color:#fff}
:root[data-theme="dark"] .save{color:#0f1720}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .save{color:#0f1720}}
.save:disabled{opacity:.4}
.del{border:1px solid var(--out);background:transparent;color:var(--out);border-radius:14px;padding:14px;font-weight:600}
.del.sure{background:var(--out);color:#fff}
.err{color:var(--out);font-size:14px;min-height:1em}
@media (prefers-reduced-motion: no-preference){.sheet.on{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div id="root"></div>
<script id="app">
(function(){
var CATS={
  out:["อาหาร","เดินทาง","ของใช้","ค่าน้ำไฟ/บิล","ค่าโทรศัพท์","ช้อปปิ้ง","สุขภาพ","บันเทิง","ให้ครอบครัว","อื่นๆ"],
  in:["เงินเดือน","ขายของ","ค่าจ้าง","โบนัส","ได้คืน","อื่นๆ"]
};
var MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
var MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
var DAYS=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];

var KEY="money-app-v1";
var state;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){state=null}
if(!state||!state.items)state={v:1,items:[]};
if(!state.custom)state.custom={out:[],in:[]};
if(!state.deleted)state.deleted=[];
state.items.forEach(function(x){if(!x.u)x.u=x.ts||1});
function catsOf(t){return CATS[t].slice(0,-1).concat(state.custom[t]||[],[CATS[t][CATS[t].length-1]])}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

function pad(n){return (n<10?"0":"")+n}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function money(n){return n.toLocaleString("th-TH",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

var ym=(function(){try{var s=sessionStorage.getItem("ym");if(s)return s}catch(e){}return today().slice(0,7)})();
function setYm(v){ym=v;try{sessionStorage.setItem("ym",v)}catch(e){}render()}
function shiftMonth(k){var y=+ym.slice(0,4),m=+ym.slice(5,7)-1+k;y+=Math.floor(m/12);m=((m%12)+12)%12;setYm(y+"-"+pad(m+1))}

/* ---------- บันทึก ---------- */
var mode="ok",status="";
try{localStorage.setItem(KEY+"-test","1");localStorage.removeItem(KEY+"-test")}catch(e){mode="none"}
var stTimer=null;
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){return false}}
function persist(){
  status=saveLocal()?"บันทึกแล้ว":"บันทึกไม่สำเร็จ เครื่องเต็มหรือเปิดโหมดไม่ระบุตัวตน";
  render();
  clearTimeout(stTimer);stTimer=setTimeout(function(){status="";render()},2000);
  scheduleSync();
}

/* ---------- Google Sheets ---------- */
var SYNC_KEY="money-app-sync";
var sync=(function(){try{return JSON.parse(localStorage.getItem(SYNC_KEY))||{}}catch(e){return {}}})();
function saveSyncCfg(){try{localStorage.setItem(SYNC_KEY,JSON.stringify(sync))}catch(e){}}
var syncing=false,syncAgain=false,syncTimer=null,syncState="",gsOpen=false,gsErr="",gsBusy=false;
var GS_RE=/^https:\/\/script\.google\.com\/(a\/[^\/]+\/)?macros\/s\/[\w-]+\/exec\/?$/;
function scheduleSync(ms){if(!sync.url)return;clearTimeout(syncTimer);syncTimer=setTimeout(doSync,ms==null?800:ms)}
function doSync(){
  if(!sync.url)return;
  if(syncing){syncAgain=true;return}
  if(navigator.onLine===false){syncState="offline";render();return}
  syncing=true;syncState="sending";render();
  var sentAt=Date.now();
  fetch(sync.url,{method:"POST",body:JSON.stringify({op:"sync",items:state.items,deleted:state.deleted,custom:state.custom,customU:state.customU||0})})
  .then(function(r){return r.json()})
  .then(function(res){
    if(!res||!res.ok)throw new Error((res&&res.error)||"ชีตตอบกลับผิดรูปแบบ");
    var del={};(res.deleted||[]).forEach(function(id){del[id]=1});
    var lateDel=state.deleted.filter(function(d){return d.at>sentAt});
    lateDel.forEach(function(d){del[d.id]=1});
    var merged={};
    (res.items||[]).forEach(function(x){if(!del[x.id])merged[x.id]=x});
    var late=false;
    state.items.forEach(function(x){if(!del[x.id]&&x.u>sentAt){merged[x.id]=x;late=true}});
    state.items=Object.keys(merged).map(function(k){return merged[k]});
    state.deleted=lateDel;
    if((res.customU||0)>(state.customU||0)&&res.custom){state.custom={out:res.custom.out||[],in:res.custom.in||[]};state.customU=res.customU}
    saveLocal();
    sync.last=Date.now();saveSyncCfg();syncState="ok";
    if(late||lateDel.length)syncAgain=true;
  })
  .catch(function(e){syncState=navigator.onLine===false?"offline":"error";gsErr=String(e&&e.message||e)})
  .then(function(){syncing=false;render();if(syncAgain){syncAgain=false;scheduleSync(300)}});
}
function connectGs(){
  var v=(document.getElementById("gs-url").value||"").trim();
  if(!GS_RE.test(v)){gsErr="ลิงก์ไม่ถูก ต้องขึ้นต้น https://script.google.com/macros/s/ และลงท้าย /exec";render();return}
  gsBusy=true;gsErr="";render();
  fetch(v).then(function(r){return r.json()}).then(function(res){
    if(!res||res.app!=="money-app")throw 0;
    sync.url=v;saveSyncCfg();gsOpen=false;gsBusy=false;doSync();
  }).catch(function(){gsBusy=false;gsErr="เชื่อมไม่ได้ เช็คว่าตั้ง \"ผู้ที่มีสิทธิ์เข้าถึง\" เป็น \"ทุกคน\" แล้วคัดลอกลิงก์ /exec มาใหม่";render()});
}
window.addEventListener("online",function(){scheduleSync(0)});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")scheduleSync(0)});
function hm(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
function gsCard(){
  var h='<div class="card"><h2>Google Sheets</h2>';
  if(!sync.url){
    h+='<p class="hint">ยังไม่ได้เชื่อม ข้อมูลอยู่ในเครื่องนี้อย่างเดียว ล้างเครื่องแล้วจะหาย เชื่อมแล้วทุกรายการจะส่งขึ้นชีตของคุณเอง</p>';
    if(!gsOpen)h+='<div class="foot"><button class="ghost strong" id="gs-open">เชื่อม Google Sheets</button><a class="ghost" href="setup.html">วิธีตั้งค่า (5 นาที)</a></div>';
  }else{
    var st=syncState==="sending"?"กำลังส่งขึ้นชีต…":syncState==="offline"?"ไม่มีเน็ต จดไว้ในเครื่องก่อน ต่อเน็ตแล้วจะส่งให้เอง":syncState==="error"?"ส่งไม่สำเร็จ: "+gsErr:(sync.last?"ส่งขึ้นชีตแล้ว ล่าสุด "+hm(sync.last):"เชื่อมแล้ว");
    h+='<p class="hint'+(syncState==="error"?" bad":"")+'"><span class="dot '+(syncState||"ok")+'"></span>'+esc(st)+'</p>';
    h+='<div class="foot"><button class="ghost" id="gs-now">ส่งตอนนี้</button><button class="ghost" id="gs-off">เลิกเชื่อม</button></div>';
  }
  if(gsOpen){
    h+='<div class="field" style="margin-top:10px"><label for="gs-url">วางลิงก์เว็บแอปจาก Apps Script (ลงท้าย /exec)</label><input class="txt" id="gs-url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec"></div>'+
       '<div class="err">'+esc(gsErr)+'</div><div class="foot"><button class="ghost strong" id="gs-go"'+(gsBusy?" disabled":"")+'>'+(gsBusy?"กำลังเชื่อม…":"เชื่อม")+'</button><button class="ghost" id="gs-x">ยกเลิก</button></div>';
  }
  return h+'</div>';
}
function backup(){
  var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="รายรับรายจ่าย-"+today()+".json";
  document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000);
}
function restore(file){
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);if(!d||!Array.isArray(d.items))throw 0;
      var have={};state.items.forEach(function(x){have[x.id]=1});
      if(d.custom)["out","in"].forEach(function(t){(d.custom[t]||[]).forEach(function(k){if(catsOf(t).indexOf(k)<0)state.custom[t].push(k)})});
      state.customU=Date.now();
      var n=0;d.items.forEach(function(x){if(x&&x.id&&!have[x.id]&&x.amt>0&&x.date){state.items.push(x);n++}});
      persist();status="นำเข้า "+n+" รายการ";render();
    }catch(e){status="ไฟล์นี้ไม่ใช่ไฟล์สำรองของแอปนี้";render()}
  };
  r.readAsText(file);
}
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(function(){})}

/* ---------- พูด/พิมพ์ แล้วแยกให้เอง ---------- */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
var listening=false,rec=null;
function listen(){
  if(listening&&rec){rec.stop();return}
  try{
    rec=new SR();rec.lang="th-TH";rec.interimResults=false;rec.maxAlternatives=1;
    rec.onresult=function(e){var t=e.results[0][0].transcript;listening=false;render();quick(t)};
    rec.onerror=function(e){listening=false;status=e.error==="not-allowed"?"ยังไม่ได้อนุญาตไมค์ ไปเปิดในตั้งค่าเบราว์เซอร์":"ฟังไม่ชัด ลองอีกครั้ง หรือพิมพ์แทน";render()};
    rec.onend=function(){if(listening){listening=false;render()}};
    rec.start();listening=true;render();

var TH_D={"ศูนย์":0,"หนึ่ง":1,"เอ็ด":1,"สอง":2,"ยี่":2,"สาม":3,"สี่":4,"ห้า":5,"หก":6,"เจ็ด":7,"แปด":8,"เก้า":9};
var TH_U={"สิบ":10,"ร้อย":100,"พัน":1000,"หมื่น":10000,"แสน":100000,"ล้าน":1000000};
function thaiWordsNum(t){
  var re=/(ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน)+/g,m,best=null;
  while((m=re.exec(t))){
    var w=m[0],toks=w.match(/ศูนย์|หนึ่ง|เอ็ด|สอง|ยี่|สาม|สี่|ห้า|หก|เจ็ด|แปด|เก้า|สิบ|ร้อย|พัน|หมื่น|แสน|ล้าน/g),tot=0,sec=0,d=null;
    toks.forEach(function(k){
      if(k in TH_D){d=TH_D[k]}
      else if(k==="ล้าน"){sec+=(d||0);tot=(tot+sec||1)*1000000;sec=0;d=null}
      else{sec+=(d===null?1:d)*TH_U[k];d=null}
    });
    var v=tot+sec+(d||0);
    if(v>0&&(!best||w.length>best.w.length))best={v:v,w:w};
  }
  return best;
}

function has(t,w){return t.indexOf(w)>-1}
function normT(raw){return raw.replace(/[๐-๙]/g,function(c){return "๐๑๒๓๔๕๖๗๘๙".indexOf(c)}).toLowerCase()}
var UNIT_RE=/^\s*(จาน|แก้ว|ชิ้น|อัน|ห่อ|ถุง|คน|ขวด|กล่อง|ลิตร|โล|กิโล|ตัว|ที่|ชาม|ลูก|ใบ|คู่|วัน|เดือน|ปี|ครั้ง|รอบ|มื้อ|โมง|ทุ่ม|ชั่วโมง|นาที|เล่ม|แพ็ค|โหล|ไม้|หลัง|คัน|%|-\d)/;
// หาตัวเลขที่เป็นจำนวนเงิน ข้ามเลขที่ตามด้วยหน่วย เช่น 2 จาน
function findAmounts(t){
  var re=/(\d[\d,]*(?:\.\d+)?)\s*(k|พัน|หมื่น|แสน)?\s*(บาท)?/g,m,out=[];
  while((m=re.exec(t))){
    var after=t.slice(m.index+m[1].length);
    if(m.index>0&&/[-\/:]/.test(t.charAt(m.index-1)))continue;
    if(!m[2]&&!m[3]&&UNIT_RE.test(after))continue;
    var v=parseFloat(m[1].replace(/,/g,""))*({k:1000,"พัน":1000,"หมื่น":10000,"แสน":100000}[m[2]]||1);
    if(v>0)out.push({i:m.index,end:m.index+m[0].length,v:v,txt:m[0]});
  }
  if(!out.length){var w=thaiWordsNum(t);if(w){var i=t.indexOf(w.w),e=i+w.w.length,b=t.slice(e).match(/^\s*บาท/);out.push({i:i,end:e+(b?b[0].length:0),v:w.v,txt:t.slice(i,e+(b?b[0].length:0))})}}
  return out;
}

function splitItems(raw){
  var t=normT(raw),am=findAmounts(t);
  if(am.length<2)return [parseText(raw)];
  var shift=has(t,"เมื่อวานซืน")?" เมื่อวานซืน":has(t,"เมื่อวาน")?" เมื่อวาน":"";
  var res=[],start=0;
  am.forEach(function(a,k){
    var end=k===am.length-1?raw.length:a.end;
    var seg=raw.slice(start,end).replace(/^[\s,+]+|^(และ|แล้วก็)\s*/g,"").trim();
    start=end;
    if(seg)res.push(parseText(seg+shift));
  });
  return res;
}
function parseText(raw){
  var t=normT(raw);
  var r={t:"out",amt:"",cat:"",date:today(),note:""};
  // จำนวนเงิน
  var am=findAmounts(t),numTxt="";
  if(am.length){var a=am[am.length-1];r.amt=String(a.v);numTxt=a.txt}
  // วันที่
  var dd=new Date();
  if(has(t,"เมื่อวานซืน")){dd.setDate(dd.getDate()-2)}else if(has(t,"เมื่อวาน")){dd.setDate(dd.getDate()-1)}
  r.date=dd.getFullYear()+"-"+pad(dd.getMonth()+1)+"-"+pad(dd.getDate());
  // ข้อความที่เหลือเป็นโน้ต
  var note=raw;if(numTxt){var i=t.indexOf(numTxt);if(i>-1)note=raw.slice(0,i)+raw.slice(i+numTxt.length)}
  note=note.replace(/บาท|เมื่อวานซืน|เมื่อวาน|วันนี้/g," ").replace(/\s+/g," ").trim();
  r.note=note.slice(0,60);
  var nl=note.toLowerCase();
  // 1) เคยจดข้อความแบบนี้มาก่อน ใช้หมวดเดิม
  var past=state.items.slice().sort(function(a,b){return b.ts-a.ts});
  for(var k=0;k<past.length;k++){var pn=(past[k].note||"").toLowerCase();if(pn.length>=2&&(nl===pn||(nl&&(has(nl,pn)||has(pn,nl))))){r.t=past[k].t;r.cat=past[k].cat;return r}}
  // 2) รายรับหรือรายจ่าย
  if(INCOME_WORDS.some(function(w){return has(t,w)}))r.t="in";
  // 3) หมวดที่ตั้งเอง
  var own=(state.custom[r.t]||[]).filter(function(c){return has(t,c.toLowerCase())});
  if(own.length){r.cat=own[0];return r}
  // 4) คำสำคัญ เลือกคำที่ยาวที่สุดที่เจอ
  var best=null;
  KW[r.t].forEach(function(row){row[1].forEach(function(w){if(has(t,w)&&(!best||w.length>best.len))best={cat:row[0],len:w.length}})});
  r.cat=best?best.cat:(r.t==="out"?"อื่นๆ":"อื่นๆ");
  return r;
}

  bind("gs-now",function(){scheduleSync(0)});
  bind("gs-off",function(){var b=document.getElementById("gs-off");if(b.dataset.sure){sync={};saveSyncCfg();syncState="";render()}else{b.dataset.sure=1;b.textContent="กดอีกครั้งเพื่อเลิกเชื่อม"}});
  var rs=document.getElementById("rs");if(rs)rs.addEventListener("change",function(){if(rs.files[0])restore(rs.files[0])});
  root.querySelectorAll(".item").forEach(function(b){
    b.addEventListener("click",function(){
      if(mode==="ro")return;
      var it=state.items.find(function(x){return x.id===b.dataset.id});
      if(it)openSheet(it);
    });
  });
}
function bind(id,fn){var el=document.getElementById(id);if(el)el.addEventListener("click",fn)}

function copyAll(){
  var rows=["วันที่\tประเภท\tหมวด\tจำนวนเงิน\tโน้ต"];
  state.items.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts}).forEach(function(x){
    rows.push([x.date,x.t==="in"?"รายรับ":"รายจ่าย",x.cat,x.amt,(x.note||"").replace(/\s+/g," ")].join("\t"));
  });
  var btn=document.getElementById("copy");
  try{
    navigator.clipboard.writeText(rows.join("\n")).then(function(){btn.textContent="คัดลอกแล้ว"},function(){btn.textContent="คัดลอกไม่ได้ในเครื่องนี้"});
  }catch(e){btn.textContent="คัดลอกไม่ได้ในเครื่องนี้"}
}

/* ---------- แผ่นกรอก ---------- */
var scrim=document.createElement("div");scrim.className="scrim";
var sheet=document.createElement("div");sheet.className="sheet";sheet.setAttribute("role","dialog");sheet.setAttribute("aria-modal","true");
document.body.appendChild(scrim);document.body.appendChild(sheet);
scrim.addEventListener("click",closeSheet);
var cur=null;
function closeSheet(){scrim.classList.remove("on");sheet.classList.remove("on");cur=null}
function openSheet(it,msg){
  cur={msg:msg||"",id:it.id||null,t:it.t,amt:it.amt?String(it.amt):"",cat:it.cat||"",date:it.date||(ym===today().slice(0,7)?today():ym+"-01"),note:it.note||""};
  drawSheet();
  scrim.classList.add("on");sheet.classList.add("on");
  if(!cur.id&&!cur.amt)setTimeout(function(){var a=document.getElementById("f-amt");if(a)a.focus()},60);
}
function drawSheet(){
  var c=cur,h="";
  if(c.msg)h+='<div class="heard">'+esc(c.msg)+'</div>';
  h+='<div class="seg"><button class="out'+(c.t==="out"?" on":"")+'" data-t="out">รายจ่าย</button><button class="in'+(c.t==="in"?" on":"")+'" data-t="in">รายรับ</button></div>';
  h+='<div class="amtbox"><span>฿</span><input id="f-amt" inputmode="decimal" placeholder="0" autocomplete="off" value="'+esc(c.amt)+'" aria-label="จำนวนเงิน"></div>';
  var mine=state.custom[c.t]||[];
  h+='<div class="field"><label>หมวด</label><div class="chips">';
  catsOf(c.t).forEach(function(k){
    var own=mine.indexOf(k)>-1;
    h+='<button class="chip'+(c.cat===k?" on":"")+(own&&c.editCats?" own":"")+'" data-cat="'+esc(k)+'">'+esc(k)+(own&&c.editCats?' <span aria-hidden="true">✕</span>':'')+'</button>';
  });
  h+='<button class="chip add" id="f-newcat">+ หมวดใหม่</button>';
  if(mine.length)h+='<button class="chip add" id="f-editcat">'+(c.editCats?'เสร็จ':'ลบหมวดที่ตั้งเอง')+'</button>';
  h+='</div>';
  if(c.newCat)h+='<div class="newcat"><input class="txt" id="f-catname" maxlength="20" placeholder="ชื่อหมวด เช่น ค่าเทอมลูก" autocomplete="off"><button class="save" id="f-catok">เพิ่ม</button></div>';
  if(c.editCats)h+='<p class="hint">กดหมวดที่มี ✕ เพื่อลบ รายการเก่าที่ใช้หมวดนั้นยังอยู่</p>';
  h+='</div>';
  h+='<div class="two"><div class="field"><label for="f-date">วันที่</label><input class="txt" type="date" id="f-date" value="'+c.date+'"></div>'+
     '<div class="field"><label for="f-note">โน้ต (ไม่ใส่ก็ได้)</label><input class="txt" id="f-note" maxlength="60" placeholder="เช่น ข้าวมันไก่" value="'+esc(c.note)+'"></div></div>';
  h+='<div class="err" id="f-err"></div>';
  h+='<button class="save" id="f-save">'+(c.id?"บันทึกการแก้ไข":"บันทึก")+'</button>';
  if(c.id)h+='<button class="del" id="f-del">ลบรายการนี้</button>';
  h+='<button class="ghost" id="f-cancel">ยกเลิก</button>';
  sheet.innerHTML=h;

  var amt=document.getElementById("f-amt");
  amt.addEventListener("input",function(){c.amt=amt.value.replace(/[^\d.]/g,"");if(amt.value!==c.amt)amt.value=c.amt});
  document.getElementById("f-date").addEventListener("change",function(e){c.date=e.target.value});
  document.getElementById("f-note").addEventListener("input",function(e){c.note=e.target.value});
  sheet.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){if(c.t!==b.dataset.t){keepFields();c.t=b.dataset.t;c.cat="";c.newCat=false;c.editCats=false;drawSheet()}})});
  sheet.querySelectorAll(".chip[data-cat]").forEach(function(b){b.addEventListener("click",function(){
    var k=b.dataset.cat;
    if(c.editCats&&b.classList.contains("own")){
      state.custom[c.t]=state.custom[c.t].filter(function(x){return x!==k});state.customU=Date.now();
      if(c.cat===k)c.cat="";
      if(!state.custom[c.t].length)c.editCats=false;
      keepFields();persist();drawSheet();return;
    }
    c.cat=k;sheet.querySelectorAll(".chip[data-cat]").forEach(function(x){x.classList.toggle("on",x===b)});
  })});
  bindS("f-newcat",function(){keepFields();c.newCat=!c.newCat;c.editCats=false;drawSheet();var i=document.getElementById("f-catname");if(i)i.focus()});
  bindS("f-editcat",function(){keepFields();c.editCats=!c.editCats;c.newCat=false;drawSheet()});
  bindS("f-catok",addCat);
  var cn=document.getElementById("f-catname");
  if(cn)cn.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();addCat()}});
  function addCat(){
    var v=(document.getElementById("f-catname").value||"").trim().replace(/\s+/g," ");
    if(!v)return;
    if(catsOf(c.t).indexOf(v)<0){state.custom[c.t].push(v);state.customU=Date.now()}
    c.cat=v;c.newCat=false;keepFields();persist();drawSheet();
  }
  document.getElementById("f-save").addEventListener("click",save);
  document.getElementById("f-cancel").addEventListener("click",closeSheet);
  var del=document.getElementById("f-del");
  if(del)del.addEventListener("click",function(){
    if(!del.classList.contains("sure")){del.classList.add("sure");del.textContent="กดอีกครั้งเพื่อยืนยันลบ";return}
    state.items=state.items.filter(function(x){return x.id!==c.id});
    state.deleted.push({id:c.id,at:Date.now()});
    closeSheet();render();persist();
  });
}
function bindS(id,fn){var el=document.getElementById(id);if(el)el.addEventListener("click",fn)}
function keepFields(){var a=document.getElementById("f-amt");if(a)cur.amt=a.value}
function save(){
  var c=cur,err=document.getElementById("f-err");
  var n=parseFloat(c.amt);
  if(!(n>0)){err.textContent="ใส่จำนวนเงินก่อน";return}
  if(!c.cat){err.textContent="เลือกหมวดก่อน";return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(c.date)){err.textContent="เลือกวันที่ก่อน";return}
  n=Math.round(n*100)/100;
  if(c.id){
    var it=state.items.find(function(x){return x.id===c.id});
    if(it){it.t=c.t;it.amt=n;it.cat=c.cat;it.date=c.date;it.note=c.note.trim();it.u=Date.now()}
  }else{
    state.items.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:c.t,amt:n,cat:c.cat,date:c.date,note:c.note.trim(),ts:Date.now(),u:Date.now()});
  }
  if(c.date.slice(0,7)!==ym){ym=c.date.slice(0,7);try{sessionStorage.setItem("ym",ym)}catch(e){}}
  closeSheet();render();persist();
}

render();
scheduleSync(0);
})();
</script>
</body>
</html>
